name: Release APK

# Publishes the APK to GitHub Releases so it can be installed from a phone.
#
# Three ways in:
#   - push to a branch: publishes if versionName in app/build.gradle.kts has no
#     release yet, so bumping the version and pushing is all it takes;
#   - push a tag (git tag v1.0.1 && git push origin v1.0.1);
#   - run it by hand from the Actions tab.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.0.0'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag and whether it still needs publishing
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          INPUT_TAG='${{ github.event.inputs.tag }}'
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # A tag push or a manual run always republishes. A plain branch push
          # only publishes a version that has no release yet, so routine pushes
          # never quietly replace a release people may already have installed.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ] \
             && gh release view "$TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists - bump versionName to publish a new one."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.plan.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.plan.outputs.publish == 'true'

      - name: Unit tests
        if: steps.plan.outputs.publish == 'true'
        run: ./gradlew testDebugUnitTest

      - name: Configure release signing
        if: steps.plan.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.DAYDROP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DAYDROP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAYDROP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DAYDROP_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "Configure the DAYDROP signing secrets before publishing."
            exit 1
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daydrop-release.jks"

      - name: Build signed release APK
        if: steps.plan.outputs.publish == 'true'
        env:
          DAYDROP_KEYSTORE: ${{ runner.temp }}/daydrop-release.jks
          DAYDROP_KEYSTORE_PASSWORD: ${{ secrets.DAYDROP_KEYSTORE_PASSWORD }}
          DAYDROP_KEY_ALIAS: ${{ secrets.DAYDROP_KEY_ALIAS }}
          DAYDROP_KEY_PASSWORD: ${{ secrets.DAYDROP_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Publish the release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          APK="DayDrop-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "${{ github.sha }}" \
              --title "DayDrop $VERSION" \
              --generate-notes \
              --latest
          fi
